<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>a loop with a cap: after the last allowed try it stops and reports</title>
<defs><marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.5 L12 5 L0 9.5 Z" fill="currentColor" style="fill:context-stroke"/></marker></defs>
<rect x="130" y="80" width="140" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="200" y="109.6" font-size="16" text-anchor="middle" fill="currentColor">work</text>
<rect x="410" y="72" width="140" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="480" y="99.6" font-size="16" text-anchor="middle" fill="currentColor">check</text>
<text x="480" y="118.9" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="0.8">try n of 3</text>
<rect x="690" y="80" width="140" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="760" y="109.6" font-size="16" text-anchor="middle" fill="currentColor">done</text>
<rect x="390" y="202" width="180" height="48" rx="8" fill="none" stroke="#c9571a" stroke-width="2"/>
<text x="480" y="231.6" font-size="16" text-anchor="middle" fill="currentColor">stop and report</text>
<path d="M270 104 L410 104" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M550 104 L690 104" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M480 72 L480 40 L200 40 L200 80" fill="none" stroke="#c9571a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M480 136 L480 202" fill="none" stroke="#c9571a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="28" font-size="14" text-anchor="middle" fill="#c9571a">fail, tries left: feedback</text>
<text x="620" y="93" font-size="14" text-anchor="middle" fill="currentColor">pass</text>
<text x="494" y="174" font-size="14" text-anchor="start" fill="#c9571a">fail on try 3: cap reached</text>
</svg>
