<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>chain: each step waits for the one before</title>
<defs><marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.5 L12 5 L0 9.5 Z" fill="currentColor" style="fill:context-stroke"/></marker></defs>
<rect x="130" y="31" width="140" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="200" y="60.6" font-size="16" text-anchor="middle" fill="currentColor">step 1</text>
<rect x="410" y="31" width="140" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="480" y="60.6" font-size="16" text-anchor="middle" fill="currentColor">step 2</text>
<rect x="690" y="31" width="140" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="760" y="60.6" font-size="16" text-anchor="middle" fill="currentColor">step 3</text>
<path d="M270 55 L410 55" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M550 55 L690 55" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="340" y="44" font-size="14" text-anchor="middle" fill="currentColor">needs result</text>
<text x="620" y="44" font-size="14" text-anchor="middle" fill="currentColor">needs result</text>
</svg>
