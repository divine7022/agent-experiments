<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>diamond: fan out to independent workers, then merge</title>
<defs><marker id="arrow" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0.5 L12 5 L0 9.5 Z" fill="currentColor" style="fill:context-stroke"/></marker></defs>
<rect x="90" y="88" width="180" height="64" rx="8" fill="none" stroke="#2a7ad1" stroke-width="2"/>
<text x="180" y="115.6" font-size="16" text-anchor="middle" fill="currentColor">split</text>
<text x="180" y="134.9" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="0.8">decides how many</text>
<rect x="390" y="20" width="180" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="480" y="49.6" font-size="16" text-anchor="middle" fill="currentColor">worker 1</text>
<rect x="390" y="96" width="180" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="480" y="125.6" font-size="16" text-anchor="middle" fill="currentColor">worker 2</text>
<rect x="390" y="172" width="180" height="48" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="480" y="201.6" font-size="16" text-anchor="middle" fill="currentColor">worker 3</text>
<rect x="690" y="88" width="180" height="64" rx="8" fill="none" stroke="#2a7ad1" stroke-width="2"/>
<text x="780" y="115.6" font-size="16" text-anchor="middle" fill="currentColor">merge</text>
<text x="780" y="134.9" font-size="14" text-anchor="middle" fill="currentColor" fill-opacity="0.8">combines results</text>
<path d="M270 120 L390 44" fill="none" stroke="#2a7ad1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M570 44 L690 104.8" fill="none" stroke="#2a7ad1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M270 120 L390 120" fill="none" stroke="#2a7ad1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M570 120 L690 120" fill="none" stroke="#2a7ad1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M270 120 L390 196" fill="none" stroke="#2a7ad1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M570 196 L690 135.2" fill="none" stroke="#2a7ad1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
